map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.togoapi.com togoapi.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/togoapi-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/togoapi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/togoapi.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 444;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.togoapi.com;

    ssl_certificate     /etc/letsencrypt/live/togoapi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/togoapi.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 256m;

    location = / {
        return 308 https://togoapi.com/;
    }

    # Risk checks do not buffer or modify Core streaming/WebSocket traffic.
    location = /_portal_risk_check {
        internal;
        proxy_pass http://127.0.0.1:3000/api/v1/internal/risk-check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Api-Key $http_x_api_key;
        proxy_set_header X-Goog-Api-Key $http_x_goog_api_key;
    }

    location @risk_banned {
        default_type application/json;
        add_header Cache-Control no-store always;
        return 403 '{"error":{"type":"permission_error","code":"ACCOUNT_RISK_BANNED","message":"账号因触发风控已被禁止使用，请联系管理员。"}}';
    }

    location / {
        include /etc/nginx/snippets/togoapi-ingress-observe-location.conf;

        auth_request /_portal_risk_check;
        error_page 403 = @risk_banned;
        # Keep upstream errors intact; only auth_request denials use the message.
        proxy_intercept_errors off;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name togoapi.com;

    ssl_certificate     /etc/letsencrypt/live/togoapi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/togoapi.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Portal routes include model requests with inline images. Keep the edge
    # proxy above application-specific limits so APIs can return structured errors.
    client_max_body_size 256m;

    include /etc/nginx/snippets/gift.locations.conf;
    include /etc/nginx/snippets/lottery.locations.conf;

    location / {
        include /etc/nginx/snippets/togoapi-ingress-observe-location.conf;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
