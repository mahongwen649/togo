# Conservative observation-only limits. Review dry-run log hits before enforcing.
limit_conn_zone $binary_remote_addr zone=togoapi_conn:20m;
limit_req_zone $binary_remote_addr zone=togoapi_req:40m rate=60r/s;

client_header_timeout 10s;
client_body_timeout 30s;
large_client_header_buffers 4 16k;
server_tokens off;
