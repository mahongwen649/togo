# Apply inside public locations. Dry-run records excess traffic without rejecting it.
limit_conn togoapi_conn 100;
limit_conn_dry_run on;
limit_conn_log_level notice;
limit_conn_status 429;

limit_req zone=togoapi_req burst=200 nodelay;
limit_req_dry_run on;
limit_req_log_level notice;
limit_req_status 429;
