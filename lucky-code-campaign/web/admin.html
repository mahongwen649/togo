<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#172121">
  <title>TogoAPI 兑换码活动管理</title>
  <link rel="icon" href="/gift/assets/togoapi-logo.png">
  <link rel="stylesheet" href="/gift/assets/app.css?v=20260728-compact-panel">
</head>
<body class="admin-page">
  <div class="admin-login" id="login-view">
    <main class="login-box">
      <a class="brand brand-dark" href="/gift/">
        <img class="brand-logo" src="/gift/assets/togoapi-logo.png" alt="TogoAPI">
        <span class="brand-copy"><strong>TogoAPI</strong><small>兑换码活动</small></span>
      </a>
      <div class="login-heading">
        <p class="eyebrow">ADMIN CONSOLE</p>
        <h1>活动管理</h1>
        <p>登录后导入兑换码并查看领取数据。</p>
      </div>
      <form id="login-form">
        <label for="password">管理员密码</label>
        <div class="input-wrap">
          <svg aria-hidden="true" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <input id="password" type="password" autocomplete="current-password" placeholder="输入管理员密码" required>
        </div>
        <p class="field-error" id="login-error" role="alert"></p>
        <button class="primary-button" type="submit">进入管理台</button>
      </form>
      <a class="back-link" href="/gift/">← 返回活动页面</a>
    </main>
  </div>

  <div id="dashboard-view" hidden>
    <header class="admin-header">
      <a class="brand brand-dark" href="/gift/admin">
        <img class="brand-logo" src="/gift/assets/togoapi-logo.png" alt="TogoAPI">
        <span class="brand-copy"><strong>TogoAPI</strong><small>活动管理台</small></span>
      </a>
      <div class="admin-actions">
        <a class="text-link" href="/gift/" target="_blank" rel="noopener">查看活动页 ↗</a>
        <button class="icon-button" id="logout-button" type="button" title="退出登录" aria-label="退出登录">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M10 17l5-5-5-5M15 12H3"/><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/></svg>
        </button>
      </div>
    </header>

    <main class="admin-main">
      <div class="admin-title-row">
        <div>
          <p class="eyebrow">CAMPAIGN OVERVIEW</p>
          <h1>奖池概览</h1>
        </div>
        <button class="secondary-button compact-button" id="refresh-button" type="button">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M20 6v6h-6M4 18v-6h6"/><path d="M18.5 9A7 7 0 0 0 6 6.5L4 12M20 12l-2 5.5A7 7 0 0 1 5.5 15"/></svg>
          刷新
        </button>
      </div>

      <section class="stats-grid" aria-label="奖池统计">
        <article class="stat-card stat-total">
          <span class="stat-label">兑换码总数</span>
          <strong id="stat-total">—</strong>
          <span class="stat-caption">累计导入</span>
        </article>
        <article class="stat-card stat-claimed">
          <span class="stat-label">已领取</span>
          <strong id="stat-claimed">—</strong>
          <span class="stat-caption" id="claim-rate">领取率 —</span>
        </article>
        <article class="stat-card stat-remaining">
          <span class="stat-label">剩余库存</span>
          <strong id="stat-remaining">—</strong>
          <span class="stat-caption">仍可随机发放</span>
        </article>
      </section>

      <section class="admin-section import-section">
        <div class="section-heading">
          <div>
            <span class="section-index">01</span>
            <h2>导入兑换码</h2>
          </div>
          <p>支持 TXT 或 CSV；每行一枚，CSV 读取第一列。已存在的兑换码会自动跳过。</p>
        </div>
        <div class="import-grid">
          <div>
            <label for="codes-input">兑换码内容</label>
            <textarea id="codes-input" rows="8" placeholder="CODE-8F3K-21MZ&#10;CODE-6Q9P-47AX&#10;CODE-2N5R-83JL"></textarea>
            <div class="textarea-meta"><span id="line-count">0 行</span><span>单次最大 5 MB</span></div>
          </div>
          <div class="drop-zone" id="drop-zone">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 3v12M7 8l5-5 5 5"/><path d="M5 21h14a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2"/></svg>
            <strong>选择文件或拖到这里</strong>
            <span>TXT / CSV</span>
            <input id="file-input" type="file" accept=".txt,.csv,text/plain,text/csv">
          </div>
        </div>
        <div class="import-actions">
          <button class="primary-button compact-button" id="import-button" type="button">确认导入</button>
          <span class="import-feedback" id="import-feedback" role="status"></span>
        </div>
      </section>

      <section class="admin-section records-section">
        <div class="section-heading records-heading">
          <div>
            <span class="section-index">02</span>
            <h2>领取记录</h2>
          </div>
          <div class="record-tools">
            <div class="search-wrap">
              <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
              <input id="search-input" type="search" placeholder="搜索设备标识或兑换码">
            </div>
            <a class="secondary-button compact-button" id="export-link" href="/gift/api/admin/claims/export">
              <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M5 21h14a2 2 0 0 0 2-2v-2"/></svg>
              导出 CSV
            </a>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>参与标识</th><th>兑换码</th><th>领取时间</th><th aria-label="操作"></th></tr></thead>
            <tbody id="records-body"></tbody>
          </table>
          <div class="table-empty" id="records-empty" hidden>还没有领取记录</div>
        </div>
        <div class="pagination">
          <span id="records-summary">共 0 条</span>
          <div>
            <button class="icon-button" id="prev-page" type="button" aria-label="上一页" title="上一页">
              <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>
            </button>
            <span id="page-label">1 / 1</span>
            <button class="icon-button" id="next-page" type="button" aria-label="下一页" title="下一页">
              <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>
            </button>
          </div>
        </div>
      </section>
    </main>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="/gift/assets/admin.js?v=20260728-device-limit" defer></script>
</body>
</html>
