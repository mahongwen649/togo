services:
  napcat:
    image: mlikiowa/napcat-docker:latest
    container_name: qq-status-napcat
    restart: unless-stopped
    environment:
      NAPCAT_UID: "1000"
      NAPCAT_GID: "1000"
      ACCOUNT: ${QQ_ACCOUNT:?QQ_ACCOUNT is required}
    ports:
      - "127.0.0.1:16099:6099"
    volumes:
      - ./data/napcat/config:/app/napcat/config
      - ./data/napcat/qq:/app/.config/QQ
    networks:
      - bot-network
    healthcheck:
      test: ["CMD-SHELL", "test -f /app/napcat/config/webui.json"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  status-bot:
    build: .
    container_name: qq-status-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ONEBOT_WS_URL: ws://napcat:3001
    depends_on:
      napcat:
        condition: service_healthy
    networks:
      - bot-network

networks:
  bot-network:
    internal: false
