server {
    listen 80;
    listen [::]:80;
    server_name img.togoapi.com;

    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name img.togoapi.com;

    ssl_certificate     /etc/letsencrypt/live/img.togoapi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/img.togoapi.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 64m;

    root /opt/imgtool/web/dist;
    index index.html;

    location /api/ {
        include /etc/nginx/snippets/togoapi-ingress-observe-location.conf;

        proxy_pass http://127.0.0.1:18082;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;

        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /sso {
        include /etc/nginx/snippets/togoapi-ingress-observe-location.conf;

        proxy_pass http://127.0.0.1:18082;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
    }

    location / {
        include /etc/nginx/snippets/togoapi-ingress-observe-location.conf;

        try_files $uri $uri/ /index.html;
    }
}
